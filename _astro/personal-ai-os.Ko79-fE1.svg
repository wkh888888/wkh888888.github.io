<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-label="个人 AI 操作系统架构：感知层、认知层、行动层，以及记忆系统与数字分身">
  <title>个人 AI 操作系统架构</title>
  <defs>
